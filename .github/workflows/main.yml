name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assemblePhoneDebug assembleTvDebug
      - run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk monos.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk monos-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: monos
          path: monos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: monos-tv
          path: monos-tv.apk
